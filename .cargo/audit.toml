# cargo-audit configuration, read by `cargo audit` locally and in CI.

[advisories]
ignore = [
    # RUSTSEC-2023-0071: `rsa` Marvin timing attack, no patched release exists.
    # `rsa` is only reachable through `sqlx-mysql`, an optional sqlx backend
    # this crate never enables (sqlx is built with `postgres` only). sqlx's
    # macro crate lists every backend, so it lands in Cargo.lock but is never
    # compiled or linked. Revisit if MySQL support is ever turned on.
    "RUSTSEC-2023-0071",
]
