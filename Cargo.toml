[package]
name = "kimana-backend"
version = "0.0.0"
edition = "2021"
publish = false
default-run = "kimana-backend"

[[bin]]
name = "kimana-backend"
path = "src/main.rs"

[[bin]]
name = "migrate"
path = "src/bin/migrate.rs"

[[bin]]
name = "seed"
path = "src/bin/seed.rs"

[[bin]]
name = "rescreen"
path = "src/bin/rescreen.rs"

[dependencies]
alloy = { version = "2.5", default-features = false, features = ["std", "contract", "provider-http", "signer-local", "sol-types", "json", "reqwest-rustls-tls"] }
anyhow = "1"
argon2 = "0.6.0"
axum = { version = "0.8", features = ["multipart"] }
axum-extra = { version = "0.12.6", default-features = false, features = ["cookie"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
dotenvy = "0.15"
hex = "0.4.3"
rand = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }
thiserror = "2"
time = { version = "0.3.55", default-features = false }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["catch-panic", "cors", "request-id"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
serde_json = "1"
serial_test = { version = "4", features = ["file_locks"] }
tower = { version = "0.5", features = ["util"] }
